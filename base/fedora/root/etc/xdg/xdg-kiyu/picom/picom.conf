# kiyu 컴포지터 설정 (picom). 기본값은 "가벼운 효과": 둥근 창 모서리 + 부드러운 그림자 + 반투명 패널.
# 블러(유리 효과)는 GPU 가 없는 기기에서 비싸므로 기본 OFF — 빠른 설정의 "효과" 스위치가
# ~/.config/kiyu/picom-effects.conf 를 만들어 켠다 (/usr/lib/kiyu/compositor 참고).
backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = true;        # 전체 화면 게임/영상은 컴포지터를 거치지 않음
detect-client-opacity = true;
detect-transient = true;

# 둥근 모서리
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Xfdesktop'",
  "class_g = 'xfce4-notifyd'"
];

# 그림자
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.22;
shadow-offset-x = -14;
shadow-offset-y = -8;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "class_g = 'Xfdesktop'",
  "class_g = 'xfce4-notifyd'",
  "_GTK_FRAME_EXTENTS@:c"
];

# 페이드 (짧게)
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
fade-exclude = [ "class_g = 'xfce4-panel'", "class_g = 'Xfdesktop'" ];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.96; };
  dock = { shadow = true; corner-radius = 0; };
  dnd = { shadow = false; };
  popup_menu = { shadow = true; opacity = 1.0; };
  dropdown_menu = { shadow = true; opacity = 1.0; };
};
