<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- kiyu 기본 글꼴: Pretendard → IBM Plex Sans KR → Inter → 본고딕(Source Han Sans KR) → Noto -->
<fontconfig>
  <alias binding="same"><family>본고딕</family><prefer><family>Source Han Sans KR</family></prefer></alias>
  <alias binding="same"><family>Noto Sans CJK KR</family><prefer><family>Source Han Sans KR</family></prefer></alias>
  <alias>
    <family>Pretendard</family>
    <prefer><family>Pretendard Variable</family><family>IBM Plex Sans KR</family><family>Inter</family><family>Source Han Sans KR</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Pretendard</family><family>Pretendard Variable</family><family>IBM Plex Sans KR</family><family>Inter</family>
      <family>Source Han Sans KR</family><family>Noto Sans</family><family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias><family>system-ui</family><prefer><family>Pretendard</family><family>IBM Plex Sans KR</family><family>Source Han Sans KR</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Noto Sans Mono</family><family>Source Han Sans KR</family></prefer></alias>
</fontconfig>
