---
dontChroot: false
timeout: 120
script:
  # 라이브 전용 파일 제거
  - "-rm -f /etc/polkit-1/rules.d/49-kiyu-live-installer.rules"
  - "-rm -f /usr/share/applications/kiyu-install.desktop"
  - "-rm -f /usr/local/share/applications/calamares.desktop"
  - "-rm -f /home/*/Desktop/kiyu-install.desktop"
  - "-rm -f /home/*/*/kiyu-install.desktop"
  # 첫 부팅 작업이 설치본에서도 실행되도록
  - "-rm -f /var/lib/kiyu/firstboot-done"
  # 설치 중 남은 캐시 정리
  - "-apt-get -y clean"
  - "-rm -f /etc/apt/sources.list.d/*live*"
