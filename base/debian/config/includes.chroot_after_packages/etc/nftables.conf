#!/usr/sbin/nft -f
# kiyu 기본 방화벽: 들어오는 연결은 전부 차단, 나가는 연결은 허용.
# 포트를 열려면 /etc/nftables.d/ 에 .nft 파일을 두고 `sudo systemctl reload nftables`.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iif "lo" accept

        # IPv4 ICMP: 진단용 최소만, 속도 제한
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip protocol icmp icmp type echo-request limit rate 5/second accept

        # IPv6: 이웃 탐색/RA 는 필수
        meta l4proto ipv6-icmp icmpv6 type {
            destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
            nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query
        } accept
        meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 5/second accept

        # DHCPv6 클라이언트 응답
        ip6 daddr fe80::/64 udp dport 546 accept

        # 여기까지 매치되지 않으면 policy drop (사용자 규칙은 nftables.d 에서 뒤에 추가됨)
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

include "/etc/nftables.d/*.nft"
