<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 윈도우 폰트 이름을 요청하는 문서/웹페이지가 깨지지 않도록 동일 규격 폰트로 매핑 -->
<fontconfig>
  <alias binding="same"><family>맑은 고딕</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>굴림</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Gulim</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>돋움</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Dotum</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>바탕</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>Batang</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Noto Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>Noto Sans</family></prefer></alias>
</fontconfig>
