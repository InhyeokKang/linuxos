# kiyu 설치 프로그램 (Calamares 3.3) 설정
---
modules-search: [ local ]

instances:
  - id: final
    module: shellprocess
    config: shellprocess-final.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - initramfscfg
      - initramfs
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - packages
      - removeuser
      - shellprocess@final
      - umount
  - show:
      - finished

branding: kiyu
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
