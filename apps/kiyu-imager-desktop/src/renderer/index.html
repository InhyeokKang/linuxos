<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>kiyu Imager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.svg" width="40" height="40" alt="">
    <h1>kiyu Imager</h1>
  </header>

  <section class="step"><span class="num">1</span> 이미지</section>
  <div class="card">
    <div id="src-label" class="pick">이미지를 선택하세요</div>
    <div class="row">
      <button id="btn-file">파일 선택 (.iso)</button>
      <button id="btn-dl">최신 kiyu 내려받기</button>
    </div>
    <progress id="dl-bar" max="1" value="0" hidden></progress>
    <div id="dl-text" class="muted"></div>
  </div>

  <section class="step"><span class="num">2</span> 대상 드라이브</section>
  <div class="card row">
    <select id="drive"></select>
    <button id="btn-refresh" title="다시 검색">↻</button>
  </div>

  <section class="step"><span class="num">3</span> 굽기</section>
  <label class="check"><input type="checkbox" id="verify" checked> 굽고 나서 검증 (권장)</label>
  <div id="status" class="muted"></div>
  <progress id="flash-bar" max="1" value="0" hidden></progress>
  <button id="btn-flash" class="primary" disabled>굽기</button>
  <p class="warn">대상 드라이브의 <b>모든 데이터가 지워집니다</b>. 시스템 디스크는 목록에 나오지 않습니다.</p>

  <script src="renderer.js"></script>
</body>
</html>
