appId: org.kiyu.imager
productName: kiyu Imager
publish:
  provider: github
  owner: InhyeokKang
  repo: linuxos
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
# 각 OS 설치본: Windows NSIS(.exe), Linux AppImage (macOS 미지원)
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  icon: build/icon.png
  category: Utility
