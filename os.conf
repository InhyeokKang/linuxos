# ---------------------------------------------------------------------------
# Haneul OS - 배포판 정체성 설정 (이 파일 하나만 바꾸면 이름/버전이 바뀝니다)
# auto/config 와 스크립트들이 이 파일을 읽습니다.
# ---------------------------------------------------------------------------
OS_NAME="Haneul OS"          # 사람이 읽는 이름
OS_ID="haneul"               # 소문자 식별자 (파일 이름, os-release ID 등)
OS_VERSION="0.1.0"
OS_CODENAME="saebyeok"       # 새벽
OS_HOME_URL="https://github.com/inhyeokkang/linuxos"
OS_BUG_URL="https://github.com/inhyeokkang/linuxos/issues"

# 빌드 대상
DEBIAN_DIST="trixie"         # Debian 13 (stable)
ARCH="amd64"
DEBIAN_MIRROR="http://deb.debian.org/debian/"

# 라이브 세션 기본값 (설치 시 Calamares 에서 다시 선택 가능)
LIVE_LOCALE="ko_KR.UTF-8"
LIVE_KEYBOARD="kr"
LIVE_TIMEZONE="Asia/Seoul"
LIVE_USER="live"
LIVE_HOSTNAME="haneul"
