### /tmp/tmp.0SPTPZWUzt/mnt/boot/grub2/grub.cfg
# kiwi generated one time grub2 config file
search --file --set=root /boot/0xaff4ea7d
set default=0
if [ -n "$extra_cmdline" ]; then
  submenu "Bootable snapshot $snapshot_num" {
    menuentry "If OK, run snapper rollback and reboot." { true; }
  }
fi
if [ -n "${iso_path}" ]; then
    isoboot="iso-scan/filename=${iso_path}"
fi
set timeout=8
set timeout_style=menu
if [ "${grub_platform}" = "efi" ]; then
    echo "Please press 't' to show the boot menu on this console"
fi
set gfxmode=auto
set font=($root)/boot/x86_64/loader/grub2/fonts/unicode.pf2
set ascii_font=grub2/themes/None/ascii.pf2
set sans_bold_14_font=grub2/themes/None/DejaVuSans-Bold14.pf2
set sans_10_font=grub2/themes/None/DejaVuSans10.pf2
set sans_12_font=grub2/themes/None/DejaVuSans12.pf2
if [ -f ${font} ];then
    loadfont ${font}
fi
if [ -f ($root)/boot/${ascii_font} ];then
    loadfont ($root)/boot/${ascii_font}
fi
if [ -f ($root)/boot/${sans_bold_14_font} ];then
    loadfont ($root)/boot/${sans_bold_14_font}
fi
if [ -f ($root)/boot/${sans_10_font} ];then
    loadfont ($root)/boot/${sans_10_font}
fi
if [ -f ($root)/boot/${sans_12_font} ];then
    loadfont ($root)/boot/${sans_12_font}
fi
if [ -f ($root)/boot/grub2/themes/None/theme.txt ];then
    set theme=($root)/boot/grub2/themes/None/theme.txt
fi
terminal_input console
terminal_output gfxterm
menuentry "kiyu-0.2.0-x86_64" --class os --unrestricted {
    set gfxpayload=keep
    echo Loading kernel...
    linux ($root)/boot/x86_64/loader/linux ${extra_cmdline} ${isoboot} quiet rd.live.image slab_nomerge init_on_alloc=1 randomize_kstack_offset=on page_alloc.shuffle=1  root=live:CDLABEL=kiyu-0.2.0 rd.live.image rd.live.overlay.persistent rd.live.overlay.cowfs=ext4
    echo Loading initrd...
    initrd ($root)/boot/x86_64/loader/initrd
}
menuentry "Failsafe -- kiyu-0.2.0-x86_64" --class os --unrestricted {
    set gfxpayload=keep
    echo Loading kernel...
    linux ($root)/boot/x86_64/loader/linux ${extra_cmdline} ${isoboot} quiet rd.live.image slab_nomerge init_on_alloc=1 randomize_kstack_offset=on page_alloc.shuffle=1  ide=nodma apm=off noresume edd=off nomodeset 3  root=live:CDLABEL=kiyu-0.2.0 rd.live.image rd.live.overlay.persistent rd.live.overlay.cowfs=ext4
    echo Loading initrd...
    initrd ($root)/boot/x86_64/loader/initrd
}
menuentry "Boot from Hard Disk" --class os --unrestricted {
    exit
}
if [ -f "/.snapshots/grub-snapshot.cfg" ]; then
    source "/.snapshots/grub-snapshot.cfg"
fi
if [ "${grub_platform}" = "efi" ]; then
    hiddenentry "Text mode" --hotkey "t" {
        set textmode=true
        terminal_output console
    }
fi
### /tmp/tmp.0SPTPZWUzt/mnt/EFI/BOOT/grub.cfg
search --file --set=root /boot/0xaff4ea7d
set prefix=($root)/boot/grub2
configfile ($root)/boot/grub2/grub.cfg
