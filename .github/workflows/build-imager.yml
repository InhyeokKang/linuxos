name: Build kiyu Imager (desktop)
# 크로스 플랫폼 굽기 도구를 Windows/macOS/Linux 설치본으로 빌드한다. 태그(v*) 푸시 시 릴리스에 첨부.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['apps/kiyu-imager-desktop/**', '.github/workflows/build-imager.yml']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: kiyu-imager-windows
          - os: macos-latest
            artifact: kiyu-imager-macos
          - os: ubuntu-latest
            artifact: kiyu-imager-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/kiyu-imager-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      - name: Install
        run: npm install
      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -exec cp {} out/ \; || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/kiyu-imager-desktop/out/*
          if-no-files-found: warn
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/kiyu-imager-desktop/out/*
