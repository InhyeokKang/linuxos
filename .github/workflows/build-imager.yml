name: Build kiyu Imager (desktop)
# 굽기 도구를 Windows/Linux 설치본으로 빌드한다(macOS 미지원). 태그(v*) 푸시 시 릴리스에 첨부.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '이 태그의 릴리스에 설치본을 첨부 (예: v0.2.0). 비우면 아티팩트만'
        required: false
        default: ''
  push:
    branches: ['**']
    paths: ['apps/kiyu-imager-desktop/**', '.github/workflows/build-imager.yml']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: kiyu-imager-windows
          - os: ubuntu-latest
            artifact: kiyu-imager-linux
    runs-on: ${{ matrix.os }}
    env:
      # usb 네이티브 모듈이 node-addon-api(C++17 필요)와 맞게 컴파일되도록 표준 강제 (Linux/macOS)
      CXXFLAGS: -std=c++17
      CFLAGS: -std=gnu11
    defaults:
      run:
        working-directory: apps/kiyu-imager-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      - name: Install
        run: npm install
      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -exec cp {} out/ \; || true
          ls -la out
      - uses: actions/upload-artifact@v4
        # 아티팩트 저장소 용량이 꽉 차도(6~12시간마다 재계산) 릴리스 첨부는 계속되도록 실패를 무시한다.
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: apps/kiyu-imager-desktop/out/*
          if-no-files-found: warn
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: apps/kiyu-imager-desktop/out/*
