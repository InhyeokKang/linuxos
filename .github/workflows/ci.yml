name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml nftables
      - name: Run checks
        run: ./scripts/check.sh
