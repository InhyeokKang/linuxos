name: Build ISO

# 수동 실행 (Actions 탭 > Build ISO > Run workflow), v* 태그 푸시,
# 또는 이 워크플로 파일이 바뀐 푸시. Fedora 베이스 (kiwi-ng). 빌드 약 20~30분 + 부팅 테스트 약 10분.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['.github/workflows/build-iso.yml']

permissions:
  contents: write

jobs:
  build:
    name: kiwi-ng (Fedora)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
            /usr/local/share/boost /usr/lib/jvm /opt/microsoft "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /
      - name: Build in a Fedora container
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            -e KIYU_BUILD_DIR=/work/base/fedora/.build \
            registry.fedoraproject.org/fedora:44 bash -ec '
              dnf install -y --setopt=install_weak_deps=False \
                kiwi-cli kiwi-systemdeps-core kiwi-systemdeps-iso-media kiwi-systemdeps-bootloaders \
                kiwi-systemdeps-filesystems librsvg2-tools python3 python3-pyyaml \
                distribution-gpg-keys util-linux >/tmp/dnf.log 2>&1 || { tail -20 /tmp/dnf.log; exit 1; }
              kiwi-ng --version
              ./scripts/check.sh
              df -h /work
              ./scripts/build-fedora.sh
              df -h /work
            '
          sudo chown -R "$(id -u):$(id -g)" base/fedora/out
      - name: Collect build info
        if: always()
        run: |
          mkdir -p build-info
          sudo chown -R "$(id -u):$(id -g)" base/fedora/out 2>/dev/null || true
          cp base/fedora/out/build.log build-info/ 2>/dev/null || true
          cp base/fedora/out/*.packages build-info/ 2>/dev/null || true
          cp base/fedora/out/*.sha256 build-info/ 2>/dev/null || true
          ls -la base/fedora/out/*.iso > build-info/iso-size.txt 2>/dev/null || true
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: kiyu-iso
          path: |
            base/fedora/out/*.iso
            base/fedora/out/*.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Upload build info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info/

  boot-test:
    name: QEMU boot test (BIOS + UEFI)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf imagemagick squashfs-tools
          ls -la /dev/kvm || true
      - uses: actions/download-artifact@v4
        with:
          name: kiyu-iso
          path: iso
      - uses: actions/download-artifact@v4
        with:
          name: build-info
          path: build-info
      - name: Boot the ISO
        run: |
          iso=$(find iso -name '*.iso' | head -1)
          sudo BASE=fedora ./scripts/boot-test.sh "$iso" results 180 || true
          sudo chown -R "$(id -u):$(id -g)" results
          cp build-info/*.packages results/ 2>/dev/null || true
          cp build-info/iso-size.txt results/ 2>/dev/null || true
          tail -n 300 build-info/build.log > results/build-log-tail.txt 2>/dev/null || true
          grep -nE "error|Error|ERROR|No match|Failed" build-info/build.log > results/build-log-errors.txt 2>/dev/null || true
          cat results/summary.txt
      - name: Upload boot-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: results/
      - name: Publish results to ci-results branch
        if: always()
        env:
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/ci-results && mkdir -p /tmp/ci-results
          cp -r results/. /tmp/ci-results/
          git fetch origin ci-results && git checkout -B ci-results origin/ci-results || git checkout --orphan ci-results
          git rm -rfq . >/dev/null 2>&1 || true
          rm -rf ./*
          mkdir -p "run-$RUN"
          cp -r /tmp/ci-results/. "run-$RUN/"
          find "run-$RUN" -name '*.ppm' -delete
          printf 'run: %s\nsha: %s\ndate: %s\n' "$RUN" "$SHA" "$(date -u +%FT%TZ)" > "run-$RUN/RUN.txt"
          ln -sfn "run-$RUN" latest
          git add -A
          git commit -qm "boot-test results for run $RUN ($SHA)" || echo "nothing to commit"
          git push -f origin ci-results
